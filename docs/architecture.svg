<svg width="100%" viewBox="0 0 680 520" xmlns="http://www.w3.org/2000/svg">
<style>
  text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
  .th { font-size: 14px; font-weight: 500; }
  .ts { font-size: 12px; font-weight: 400; fill: #5F5E5A; }
  .arr { stroke: #888780; stroke-width: 1.5; }
  .leader { stroke: #B4B2A9; stroke-width: 0.5; stroke-dasharray: 4 4; }

  .c-gray rect { fill: #F1EFE8; stroke: #5F5E5A; }
  .c-gray .th { fill: #2C2C2A; }
  .c-gray .ts { fill: #5F5E5A; }

  .c-teal rect { fill: #E1F5EE; stroke: #0F6E56; }
  .c-teal .th { fill: #04342C; }
  .c-teal .ts { fill: #0F6E56; }

  .c-purple rect { fill: #EEEDFE; stroke: #534AB7; }
  .c-purple .th { fill: #26215C; }
  .c-purple .ts { fill: #534AB7; }

  .c-blue rect { fill: #E6F1FB; stroke: #185FA5; }
  .c-blue .th { fill: #042C53; }
  .c-blue .ts { fill: #185FA5; }

  .c-green rect { fill: #EAF3DE; stroke: #3B6D11; }
  .c-green .th { fill: #173404; }
  .c-green .ts { fill: #3B6D11; }

  .c-coral rect { fill: #FAECE7; stroke: #993C1D; }
  .c-coral .th { fill: #4A1B0C; }
  .c-coral .ts { fill: #993C1D; }

  .c-amber rect { fill: #FAEEDA; stroke: #854F0B; }
  .c-amber .th { fill: #412402; }
  .c-amber .ts { fill: #854F0B; }

  .c-pink rect { fill: #FBEAF0; stroke: #993556; }
  .c-pink .th { fill: #4B1528; }
  .c-pink .ts { fill: #993556; }
</style>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
</defs>

<text class="ts" x="340" y="15" text-anchor="middle">Users</text>
<g class="c-gray">
  <rect x="195" y="20" width="130" height="64" rx="8" stroke-width="0.5"/>
  <text class="th" x="260" y="42" text-anchor="middle" dominant-baseline="central">web app /</text>
  <text class="th" x="260" y="62" text-anchor="middle" dominant-baseline="central">public chat</text>
</g>
<g class="c-gray">
  <rect x="355" y="20" width="145" height="64" rx="8" stroke-width="0.5"/>
  <text class="th" x="425" y="42" text-anchor="middle" dominant-baseline="central">Embedded widget /</text>
  <text class="th" x="425" y="62" text-anchor="middle" dominant-baseline="central">Iframe</text>
</g>

<line x1="260" y1="84" x2="260" y2="120" class="arr" marker-end="url(#arrow)"/>
<line x1="420" y1="84" x2="420" y2="120" class="arr" marker-end="url(#arrow)"/>

<g class="c-teal">
  <rect x="180" y="120" width="320" height="56" rx="8" stroke-width="0.5"/>
  <text class="th" x="340" y="140" text-anchor="middle" dominant-baseline="central">Frontend</text>
  <text class="ts" x="340" y="158" text-anchor="middle" dominant-baseline="central">Next.js 14, TypeScript, Tailwind</text>
</g>

<line x1="340" y1="176" x2="340" y2="215" class="arr" marker-end="url(#arrow)"/>
<text class="ts" x="350" y="200" text-anchor="start">REST + SSE</text>

<g class="c-purple">
  <rect x="140" y="215" width="400" height="56" rx="8" stroke-width="0.5"/>
  <text class="th" x="340" y="235" text-anchor="middle" dominant-baseline="central">Backend API</text>
  <text class="ts" x="340" y="253" text-anchor="middle" dominant-baseline="central">FastAPI, SQLAlchemy, LlamaIndex</text>
</g>

<line x1="200" y1="271" x2="100" y2="340" class="arr" marker-end="url(#arrow)"/>
<line x1="290" y1="271" x2="260" y2="340" class="arr" marker-end="url(#arrow)"/>
<line x1="400" y1="271" x2="420" y2="340" class="arr" marker-end="url(#arrow)"/>
<line x1="480" y1="271" x2="580" y2="340" class="arr" marker-end="url(#arrow)"/>

<g class="c-blue">
  <rect x="40" y="340" width="120" height="56" rx="8" stroke-width="0.5"/>
  <text class="th" x="100" y="360" text-anchor="middle" dominant-baseline="central">PostgreSQL</text>
  <text class="ts" x="100" y="378" text-anchor="middle" dominant-baseline="central">Users, chatbots</text>
</g>

<g class="c-green">
  <rect x="200" y="340" width="120" height="56" rx="8" stroke-width="0.5"/>
  <text class="th" x="260" y="360" text-anchor="middle" dominant-baseline="central">Qdrant</text>
  <text class="ts" x="260" y="378" text-anchor="middle" dominant-baseline="central">Vector store</text>
</g>

<g class="c-coral">
  <rect x="360" y="340" width="120" height="56" rx="8" stroke-width="0.5"/>
  <text class="th" x="420" y="360" text-anchor="middle" dominant-baseline="central">MinIO</text>
  <text class="ts" x="420" y="378" text-anchor="middle" dominant-baseline="central">File storage</text>
</g>

<g class="c-amber">
  <rect x="520" y="340" width="120" height="56" rx="8" stroke-width="0.5"/>
  <text class="th" x="580" y="360" text-anchor="middle" dominant-baseline="central">Redis</text>
  <text class="ts" x="580" y="378" text-anchor="middle" dominant-baseline="central">Semantic cache</text>
</g>

<line x1="340" y1="271" x2="340" y2="440" class="arr" marker-end="url(#arrow)"/>

<g class="c-pink">
  <rect x="120" y="440" width="440" height="56" rx="8" stroke-width="0.5"/>
  <text class="th" x="340" y="460" text-anchor="middle" dominant-baseline="central">LLM providers (user keys)</text>
  <text class="ts" x="340" y="478" text-anchor="middle" dominant-baseline="central">OpenAI, Anthropic, Gemini, Grok, Ollama</text>
</g>
</svg>