<svg width="100%" viewBox="0 0 680 620" xmlns="http://www.w3.org/2000/svg">
<style>
  text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
  .th { font-size: 14px; font-weight: 500; }
  .ts { font-size: 12px; font-weight: 400; fill: #5F5E5A; }
  .arr { stroke: #888780; stroke-width: 1.5; }

  .c-gray rect { fill: #F1EFE8; stroke: #5F5E5A; }
  .c-gray .th { fill: #2C2C2A; }

  .c-teal rect { fill: #E1F5EE; stroke: #0F6E56; }
  .c-teal .th { fill: #04342C; }
  .c-teal .ts { fill: #0F6E56; }

  .c-purple rect { fill: #EEEDFE; stroke: #534AB7; }
  .c-purple .th { fill: #26215C; }
  .c-purple .ts { fill: #534AB7; }

  .c-green rect { fill: #EAF3DE; stroke: #3B6D11; }
  .c-green .th { fill: #173404; }

  .c-coral rect { fill: #FAECE7; stroke: #993C1D; }
  .c-coral .th { fill: #4A1B0C; }

  .c-amber rect { fill: #FAEEDA; stroke: #854F0B; }
  .c-amber .th { fill: #412402; }

  .c-pink rect { fill: #FBEAF0; stroke: #993556; }
  .c-pink .th { fill: #4B1528; }
  .c-pink .ts { fill: #993556; }
</style>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
</defs>

<text class="th" x="340" y="30" text-anchor="middle" fill="#2C2C2A">Ingestion pipeline</text>

<g class="c-gray">
  <rect x="250" y="46" width="180" height="44" rx="8" stroke-width="0.5"/>
  <text class="th" x="340" y="68" text-anchor="middle" dominant-baseline="central">Document upload</text>
</g>
<line x1="340" y1="90" x2="340" y2="116" class="arr" marker-end="url(#arrow)"/>

<g class="c-coral">
  <rect x="250" y="116" width="180" height="44" rx="8" stroke-width="0.5"/>
  <text class="th" x="340" y="138" text-anchor="middle" dominant-baseline="central">Store in MinIO</text>
</g>
<line x1="340" y1="160" x2="340" y2="186" class="arr" marker-end="url(#arrow)"/>

<g class="c-teal">
  <rect x="220" y="186" width="240" height="56" rx="8" stroke-width="0.5"/>
  <text class="th" x="340" y="206" text-anchor="middle" dominant-baseline="central">Parse document</text>
  <text class="ts" x="340" y="224" text-anchor="middle" dominant-baseline="central">PDF pages, DOCX, TXT</text>
</g>
<line x1="340" y1="242" x2="340" y2="268" class="arr" marker-end="url(#arrow)"/>

<g class="c-teal">
  <rect x="220" y="268" width="240" height="56" rx="8" stroke-width="0.5"/>
  <text class="th" x="340" y="288" text-anchor="middle" dominant-baseline="central">Chunk</text>
  <text class="ts" x="340" y="306" text-anchor="middle" dominant-baseline="central">512 tokens, 50 overlap</text>
</g>
<line x1="340" y1="324" x2="340" y2="350" class="arr" marker-end="url(#arrow)"/>

<g class="c-purple">
  <rect x="220" y="350" width="240" height="56" rx="8" stroke-width="0.5"/>
  <text class="th" x="340" y="370" text-anchor="middle" dominant-baseline="central">Embed</text>
  <text class="ts" x="340" y="388" text-anchor="middle" dominant-baseline="central">OpenAI text-embedding-3-small</text>
</g>
<line x1="340" y1="406" x2="340" y2="432" class="arr" marker-end="url(#arrow)"/>

<g class="c-green">
  <rect x="220" y="432" width="240" height="44" rx="8" stroke-width="0.5"/>
  <text class="th" x="340" y="454" text-anchor="middle" dominant-baseline="central">Store in Qdrant</text>
</g>

<line x1="40" y1="506" x2="640" y2="506" stroke="#B4B2A9" stroke-width="0.5" stroke-dasharray="4 4"/>
<text class="th" x="340" y="530" text-anchor="middle" fill="#2C2C2A">Query pipeline</text>

<g class="c-gray">
  <rect x="40" y="546" width="120" height="44" rx="8" stroke-width="0.5"/>
  <text class="th" x="100" y="568" text-anchor="middle" dominant-baseline="central">User query</text>
</g>
<line x1="160" y1="568" x2="190" y2="568" class="arr" marker-end="url(#arrow)"/>

<g class="c-amber">
  <rect x="190" y="546" width="120" height="44" rx="8" stroke-width="0.5"/>
  <text class="th" x="250" y="568" text-anchor="middle" dominant-baseline="central">Cache check</text>
</g>
<line x1="310" y1="568" x2="340" y2="568" class="arr" marker-end="url(#arrow)"/>

<g class="c-green">
  <rect x="340" y="546" width="120" height="44" rx="8" stroke-width="0.5"/>
  <text class="th" x="400" y="568" text-anchor="middle" dominant-baseline="central">Retrieve top-3</text>
</g>
<line x1="460" y1="568" x2="490" y2="568" class="arr" marker-end="url(#arrow)"/>

<g class="c-pink">
  <rect x="490" y="546" width="150" height="44" rx="8" stroke-width="0.5"/>
  <text class="th" x="565" y="568" text-anchor="middle" dominant-baseline="central">LLM + citations</text>
</g>
</svg>